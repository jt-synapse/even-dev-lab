<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <title>Cadence — Even G2/R1 Interview Copilot</title>
    <style>
      :root {
        --color-bg: #111111;
        --color-surface: #1a1a1a;
        --color-border: rgba(255, 255, 255, 0.1);
        --color-text: #ffffff;
        --color-text-dim: #8a8a8a;
        --color-accent: #fef991;
        --color-danger: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--color-bg);
        color: var(--color-text);
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          system-ui,
          sans-serif;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }

      #app {
        max-width: 780px;
        margin: 0 auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .title {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
      }

      .badge[data-tone="ready"] {
        border-color: var(--color-accent);
        color: var(--color-accent);
      }

      .badge[data-tone="mock"] {
        border-color: #cbd5e1;
        color: #cbd5e1;
      }

      .badge[data-tone="error"] {
        border-color: var(--color-danger);
        color: var(--color-danger);
      }

      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 16px;
      }

      .card-label {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--color-text-dim);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
        gap: 12px;
      }

      .metric-value {
        font-size: 15px;
        font-weight: 600;
      }

      .metric-caption {
        font-size: 12px;
        color: var(--color-text-dim);
        margin-top: 2px;
      }

      .screen-preview {
        margin: 0;
        padding: 12px;
        border-radius: 8px;
        background: #0a0a0a;
        border: 1px solid var(--color-border);
        font:
          13px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      button,
      a.button-link {
        appearance: none;
        background: rgba(255, 255, 255, 0.08);
        color: var(--color-text);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        padding: 8px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        text-decoration: none;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }

      button.accent,
      a.button-link.accent-link {
        background: var(--color-accent);
        color: #111111;
        border-color: var(--color-accent);
      }

      button.danger-btn {
        background: var(--color-danger);
        color: #111111;
        border-color: var(--color-danger);
      }

      .input-control {
        background: #0f0f0f;
        color: var(--color-text);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
      }

      .input-control.grow {
        flex: 1 1 240px;
      }

      .kb-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
      }

      .kb-textarea {
        width: 100%;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }

      .webcam-preview {
        margin-top: 12px;
        width: 100%;
        max-height: 280px;
        border-radius: 8px;
        background: #000000;
        object-fit: contain;
        border: 1px solid var(--color-border);
      }

      .webcam-thumb {
        margin-top: 10px;
        max-width: 240px;
        border-radius: 8px;
        border: 1px solid var(--color-border);
        display: block;
      }

      .bullet-list {
        margin: 8px 0 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
      }

      .error-banner {
        color: var(--color-danger);
        margin: 0;
        font-size: 13px;
      }

      .event-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .event-item {
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        font-size: 12px;
      }

      .event-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--color-text-dim);
        margin-bottom: 4px;
      }

      .event-raw {
        margin: 4px 0 0;
        font:
          11px/1.4 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: var(--color-text-dim);
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div id="app" data-app-ready="false" data-bridge-mode="connecting">
      Connecting to Cadence Copilot…
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
